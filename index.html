<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL DERBY HORSE RACING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">ROYAL DERBY</div>
            <div class="game">DERBY HORSE RACING</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🐎 [৪-ঘোড়ার ওরিজিনাল রেসিং ক্যানভাস ট্র্যাক জোন] -->
    <div class="race-track-zone">
        <div class="finish-line-bar"></div>
        <div class="horse-lane" id="lane-1">
            <div class="horse-avatar" id="horse-red">🐎<span class="horse-badge" style="background:#ea2027;">১</span></div>
        </div>
        <div class="horse-lane" id="lane-2">
            <div class="horse-avatar" id="horse-blue">🐎<span class="horse-badge" style="background:#1e3a8a;">২</span></div>
        </div>
        <div class="horse-lane" id="lane-3">
            <div class="horse-avatar" id="horse-green">🐎<span class="horse-badge" style="background:#14532d;">৩</span></div>
        </div>
        <div class="horse-lane" id="lane-4">
            <div class="horse-avatar" id="horse-yellow">🐎<span class="horse-badge" style="background:#f1c40f; color:#000;">৪</span></div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ বাজি ধরার ৪টি প্রধান ঘোড়ার বোর্ড ঘর ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn red-horse-bet" id="board-red" onclick="selectBetSide('RED_1')">
            <span class="board-label">🔴 ১ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        
        <button class="bet-board-btn blue-horse-bet" id="board-blue" onclick="selectBetSide('BLUE_2')">
            <span class="board-label">🔵 ২ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        
        <button class="bet-board-btn green-horse-bet" id="board-green" onclick="selectBetSide('GREEN_3')">
            <span class="board-label">🟢 ৩ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        
        <button class="bet-board-btn yellow-horse-bet" id="board-yellow" onclick="selectBetSide('YELLOW_4')">
            <span class="board-label">🟡 ৪ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">আপনার লাকি ঘোড়া চুজ করে START বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও START বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleDerbyRace()">START</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let selectedOption = null; // RED_1, BLUE_2, GREEN_3, YELLOW_4
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // ৪টি ঘোড়ার লাইভ ট্র্যাক পজিশন ভ্যালু ভাই ভাই
        let horsePositions = { red: 0, blue: 0, green: 0, yellow: 0 };

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/derby-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
        };

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedOption = side;
            
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            if (side === 'RED_1') document.getElementById("board-red").classList.add("active-side-bet");
            if (side === 'BLUE_2') document.getElementById("board-blue").classList.add("active-side-bet");
            if (side === 'GREEN_3') document.getElementById("board-green").classList.add("active-side-bet");
            if (side === 'YELLOW_4') document.getElementById("board-yellow").classList.add("active-side-bet");
            
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

              function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleDerbyRace();
            playAudio('click');
        }

        async function handleDerbyRace() {
            if (isSpinning) return;
            if (!selectedOption) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি ঘোড়া (১, ২, ৩ বা ৪ নম্বর) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            const msgBox = document.getElementById("win-status-box");
            msgBox.className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🏁 ঘোড়াগুলো ট্র্যাকে তুমুল গতিতে দৌড়াচ্ছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            playAudio('click');
            playAudio('spin'); // 🚀 ঘোড়া দৌড়ানোর কড়া ক্যাসিনো spin2.mp3 সাউন্ড ফায়ার লক ভাই!

            // ঘোড়ার এভাটারগুলো রিসেট ভাই ভাই
            const hRed = document.getElementById("horse-red");
            const hBlue = document.getElementById("horse-blue");
            const hGreen = document.getElementById("horse-green");
            const hYellow = document.getElementById("horse-yellow");

            hRed.style.left = "0px";
            hBlue.style.left = "0px";
            hGreen.style.left = "0px";
            hYellow.style.left = "0px";

            // ফ্রন্টএন্ডে ঘোড়া ৪টি এক টানা লাইভ দৌড়ানোর এনিমেশন ফ্রেম লুপ চালু ভাই ভাই
            let raceFrameCount = 0;
            let currentPositions = { red: 0, blue: 0, green: 0, yellow: 0 };
            
            const raceInterval = setInterval(() => {
                // স্ক্রিনের ফিনিশিং লাইনের দিকে ঘোড়াগুলোর ডাইনামিক র্যান্ডম মুভমেন্ট ভাই ভাই
                currentPositions.red += Math.random() * 4;
                currentPositions.blue += Math.random() * 4;
                currentPositions.green += Math.random() * 4;
                currentPositions.yellow += Math.random() * 4;

                // মোবাইল স্ক্রিনের ভেতরে ম্যাক্স ৮২% পজিশন সেফটি বর্ম
                hRed.style.left = Math.min(currentPositions.red, 82) + "%";
                hBlue.style.left = Math.min(currentPositions.blue, 82) + "%";
                hGreen.style.left = Math.min(currentPositions.green, 82) + "%";
                hYellow.style.left = Math.min(currentPositions.yellow, 82) + "%";

                raceFrameCount++;
            }, 40);

            try {
                const response = await fetch(`${SERVER_URL}/api/derby-race`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedOption
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ৪ সেকেন্ডের কড়া ডার্বি থ্রিল রেসিং শেষে ঘোড়া পারфেক্ট উইনিং লাইনে লক হবে ভাই ভাই
                    setTimeout(() => {
                        clearInterval(raceInterval);
                        
                        // ব্যাকঅ্যান্ড থেকে আসা অফিশিয়াল উইনার ঘোড়াকে জোর করে ফিনিশিং লাইনে পুশ লক ভাই ভাই
                        hRed.style.left = (data.winnerHorse === "RED_1") ? "85%" : "65%";
                        hBlue.style.left = (data.winnerHorse === "BLUE_2") ? "85%" : "55%" ;
                        hGreen.style.left = (data.winnerHorse === "GREEN_3") ? "85%" : "60%";
                        hYellow.style.left = (data.winnerHorse === "YELLOW_4") ? "85%" : "50%";

                        showFinalResult(data.status, data.winAmount, data.winnerName);
                    }, 4000);

                } else {
                    clearInterval(raceInterval);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopRaceState();
                }
            } catch (err) {
                clearInterval(raceInterval);
                alert("⚠️ সেশন আউট! আবার START বোতাম চাপুন ভাই ভাই।");
                stopRaceState();
            }
        }

        function showFinalResult(status, winAmount, winnerName) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                // 🎵 বাজি জিতে ঘোড়া ১ নম্বর হলে win2.mp3 রাজকীয় সাউন্ড ফায়ার লক ভাই!
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! ১ম হয়েছে: ${winnerName} ঘোড়া (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ ১ম হয়েছে: ${winnerName} ঘোড়া। এই রাউন্ডে ভাগ্য সহায় হয়নি ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopRaceState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleDerbyRace();
                }, 2000);
            }
        }

        function stopRaceState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [আপনার রিকোয়ারমেন্ট অনুযায়ী ৩টি প্রিমিয়াম সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; // 🔇 সাউন্ড অফ থাকলে কোনো অডিও প্লে হবে না ভাই ভাই!
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
