<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL DERBY VIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">ROYAL DERBY</div>
            <div class="game">DERBY HORSE RACING</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🏇 [৪-ঘোড়ার রেসিং ট্র্যাক ক্যানভাস জোন] (পিউর ভেক্টর ভাই ভাই) -->
    <div class="race-canvas-zone">
        <canvas id="race-canvas" width="340" height="240"></canvas>
    </div>

    <!-- 🎰 বাজি ধরার প্রধান ৪টি নিয়ন কালার ঘর প্যানেল ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn horse1-btn" id="board-HORSE_1" onclick="selectHorseSide('HORSE_1')">
            <span class="board-label">🔴 ১ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        <button class="bet-board-btn horse2-btn" id="board-HORSE_2" onclick="selectHorseSide('HORSE_2')">
            <span class="board-label">🔵 ২ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        <button class="bet-board-btn horse3-btn" id="board-HORSE_3" onclick="selectHorseSide('HORSE_3')">
            <span class="board-label">🟢 ৩ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        <button class="bet-board-btn horse4-btn" id="board-HORSE_4" onclick="selectHorseSide('HORSE_4')">
            <span class="board-label">🟡 ৪ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">লাকি ঘোড়া চুজ করে START বোতাম চাপুন ভাই ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও START বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleRoyalDerbyRace()">START</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("race-canvas");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let selectedHorse = null; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // ৪টি ঘোড়ার ওরিজিনাল পিউর ভেক্টর অবস্থান ও সুষম কালার ম্যাপ ভাই ভাই
        let horses = [
            { id: "HORSE_1", name: "১", x: 15, y: 35, color: "#ef4444" },
            { id: "HORSE_2", name: "২", x: 15, y: 90, color: "#3b82f6" },
            { id: "HORSE_3", name: "৩", x: 15, y: 145, color: "#10b981" },
            { id: "HORSE_4", name: "৪", x: 15, y: 200, color: "#f59e0b" }
        ];

                function renderRaceTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ৪টি রেসিং ট্র্যাক লাইন ব্যাকগ্রাউন্ড ড্রয়িং
            for (let i = 0; i < 4; i++) {
                let ty = 35 + (i * 55);
                ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
                ctx.fillRect(0, ty - 25, canvas.width, 50);
                
                ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, ty + 25);
                ctx.lineTo(canvas.width, ty + 25);
                ctx.stroke();
            }

            // 🎯 ডান পাশে লাল ফিনিশিং টার্গেট লাইন বর্ম ভাই ভাই
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(280, 0);
            ctx.lineTo(280, canvas.height);
            ctx.stroke();

            // ৪টি লাকি ঘোড়ার সোজা ডিরেক্ট মুখ এবং ওপরে নম্বর ব্যাজ প্রিন্টার লক ভাই ভাই
            horses.forEach(h => {
                ctx.save();
                // 🚀 ঘোড়াকে সোজা ট্র্যাকে ফরোয়ার্ড মুখে ট্রান্সলেট লক
                ctx.translate(h.x, h.y);
                
                // ১. ঘোড়ার ইমোজি ভেক্টর প্রিন্ট (মিরর স্কেল সহ ভাই ভাই)
                ctx.save();
                ctx.scale(-1, 1); 
                ctx.font = "24px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🐎", 0, 0);
                ctx.restore();

                // 🚀 ২. [বাগ ফিক্সড নম্বর ব্যাজ]: মিরর স্কেলের বাইরে টেক্সটকে স্বাধীন রাখায় নম্বর এখন এক শটে ঘোড়ার পিঠে ভেসে উঠবে ভাই ভাই!
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // ঘোড়ার পিঠের ওপর নম্বর ফুটিয়ে তোলার পারফেক্ট এক্সিস এলাইনমেন্ট ভাই ভাই
                ctx.fillText(h.name, 4, 1); 
                ctx.restore();
            });
        }


        function updateRaceAnimation() {
            let raceActive = false;

            horses.forEach(h => {
                if (h.vx > 0) {
                    h.x += (Math.random() * 1.5); // রানিং বুস্টিং অ্যানিমেশন
                    raceActive = true;
                }
            });

            renderRaceTrack();

            if (raceActive && isSpinning) {
                requestAnimationFrame(updateRaceAnimation);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/derby-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance fetch lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            renderRaceTrack();
        };

        function selectHorseSide(side) {
            if (isSpinning) return;
            selectedHorse = side;
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            playAudio('click');
        }

                function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else if (currentBet <= 1000) currentBet -= 100;
                else currentBet -= 500;
            }
            if (action === 'plus' && currentBet < 20000) { // 🚀 সর্বোচ্চ ২০০০০ লিমিট লক ভাই ভাই
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else if (currentBet < 1000) currentBet += 100;
                else currentBet += 500;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 20000) currentBet = 20000; // 🚀 সর্বোচ্চ ২০০০০ লিমিট লক ভাই ভাই
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleRoyalDerbyRace();
            playAudio('click');
        }

               async function handleRoyalDerbyRace() {
            if (isSpinning) return;
            if (!selectedHorse) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি লাকি ঘোড়া (১, ২, ৩ বা ৪ নম্বর) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            // ঘোড়াদের রানিং এরিয়া স্টার্ট পয়েন্টে ওরিজিনাল রিসেট লক ভাই ভাই
            horses.forEach(h => h.x = 15);

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🏇 ঘোড়াগুলো হাই-স্পিডে দৌড়াচ্ছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            
            playAudio('click');
            playAudio('spin'); // 🚀 ঘোড়দৌড় শুরু হওয়ার কড়া ক্যাসিনো spin2.mp3 সাউন্ড ফায়ার লক ভাই!

            horses.forEach(h => h.vx = 2 + Math.random() * 2);
            requestAnimationFrame(updateRaceAnimation);

            try {
                        const response = await fetch(`${SERVER_URL}/api/derby-race`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: urlUserId,
                betAmount: parseFloat(currentBet),
                wallet: urlWallet,
                betOnHorse: selectedHorse,
                game: urlParams.get('game') || "Royal-Derby" // 🎯 [মেগা ডাইনামিক গেম নেম লক]: ওয়ান-শটে ওরিজিনাল গেমের নাম ব্যাকএন্ডে পাস হবে ভাই ভাই
            })
        });


                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ৩ সেকেন্ডের থ্রিল রেসিং ফিজিক্স ব্রেক মেকানিজম ভাই ভাই
                    setTimeout(() => {
                        const physicsInterval = setInterval(() => {
                            horses.forEach(h => {
                                if (h.id === data.winningHorse) {
                                    h.x += 5.2; // বিজয়ী ঘোড়ার মেগা বুস্টার পুশ ভাই ভাই
                                } else {
                                    h.x += 1.8 + Math.random() * 1.8;
                                }
                                
                                if (h.x >= 280) {
                                    clearInterval(physicsInterval);
                                    isSpinning = false;
                                    horses.forEach(hSub => hSub.vx = 0);
                                    
                                    setTimeout(() => {
                                        showFinalReward(data.status, data.winAmount, data.winningHorse);
                                    }, 300);
                                }
                            });
                            renderRaceTrack();
                        }, 30);
                    }, 1200);

                } else {
                    isSpinning = false;
                    document.getElementById("spin-btn").disabled = false;
                    horses.forEach(h => h.vx = 0);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                }
            } catch (err) {
                isSpinning = false;
                document.getElementById("spin-btn").disabled = false;
                horses.forEach(h => h.vx = 0);
                alert("⚠️ সেশন আউট! আবার START বোতাম চাপুন ভাই ভাই।");
            }
        }

        function showFinalReward(status, winAmount, winHorse) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            const horseNumMap = { "HORSE_1": "১", "HORSE_2": "২", "HORSE_3": "৩", "HORSE_4": "৪" };
            const finalNum = horseNumMap[winHorse] || "১";

            if (status === "win") {
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! সবার আগে পৌঁছেছে: ${finalNum} নম্বর ঘোড়া (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ সবার আগে পৌঁছেছে: ${finalNum} নম্বর ঘোড়া। আবার ট্রাই করুন ভাই ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            document.getElementById("spin-btn").disabled = false;

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleRoyalDerbyRace();
                }, 2500);
            }
        }

        // 🎯 [৩টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; 
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
