<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL DERBY - DERBY HORSE RACING</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🎨 স্পীড অপ্টিমাইজড কোর সিএসএস ফ্রেম ইনজেকশন ভাই ভাই */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #060a14; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; user-select: none; }
        .header { display: none !important; } /* ডাবল ব্যালেন্স বক্স জ্যাম ব্লকার */
        
        body { 
            background: radial-gradient(circle at center, #0f1526 0%, #05080f 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100vh; 
        }

        /* 🏟️ ঘোড়দৌড় রেসিং মেইন ট্র্যাক ক্যানভাস এরিয়া */
        .game-board-container {
            position: relative;
            z-index: 5;
            width: calc(100% - 24px);
            max-width: 450px;
            height: 240px;
            margin: 15px auto 5px auto;
            background: rgba(10, 16, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 14px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 0;
            box-sizing: border-box;
        }

        /* 🏇 রেসিং লেন বা ট্র্যাক পাথ ট্র্যাক */
        .race-lane-track {
            position: relative;
            width: 100%;
            height: 45px;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            padding-left: 15px;
            box-sizing: border-box;
        }
        .race-lane-track:last-child { border-bottom: none; }

        /* 🏁 লাল ওরিজিনাল ফিনিশিং বর্ডার লাইন বর্ম (আপনার স্ক্রিনশটের সিঙ্ক!) */
        .finish-line-marker {
            position: absolute;
            right: 40px;
            top: 0;
            width: 3px;
            height: 100%;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            z-index: 10;
        }

        /* 🐎 ডাইনামিক ইমেজ-লেস সিএসএস ৩D লাকি রেসিং ঘোড়া নোড */
        .derby-horse-node {
            position: absolute;
            left: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 20;
            transition: left 0.1s linear;
        }

        /* ৪টি ঘোড়ার ওরিজিনাল লাক্সারি নিয়ন কালার রিং বর্ম */
        .horse-1 { background: radial-gradient(circle, #f87171 0%, #ef4444 100%); border: 2px solid #ff9999; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
        .horse-2 { background: radial-gradient(circle, #60a5fa 0%, #3b82f6 100%); border: 2px solid #99ccff; box-shadow: 0 0 10px rgba(59,130,246,0.4); }
        .horse-3 { background: radial-gradient(circle, #4ade80 0%, #22c55e 100%); border: 2px solid #99ffbb; box-shadow: 0 0 10px rgba(34,197,94,0.4); }
        .horse-4 { background: radial-gradient(circle, #fbbf24 0%, #d97706 100%); border: 2px solid #fef08a; box-shadow: 0 0 10px rgba(217,119,6,0.4); }

        /* 💸 বাজি ধরার প্রধান ৪টি নিয়ন মডিউল চিপস বোতাম */
        .betting-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 5px 12px; max-width: 450px; margin: 0 auto; width: calc(100% - 24px); }
        .bet-board-btn { background: linear-gradient(180deg, #141926 0%, #0c0f17 100%); border: 2px solid #20283b; border-radius: 12px; padding: 12px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .btn-h1 { border-color: #ef4444; } .btn-h1 .board-label { color: #f87171; }
        .btn-h2 { border-color: #3b82f6; } .btn-h2 .board-label { color: #60a5fa; }
        .btn-h3 { border-color: #22c55e; } .btn-h3 .board-label { color: #4ade80; }
        .btn-h4 { border-color: #d97706; } .btn-h4 .board-label { color: #fbbf24; }
        
        .board-label { font-size: 11px; font-weight: 800; letter-spacing: 0.3px; }
        .board-odds { font-size: 11px; font-weight: 700; color: #ffaa00; }
        .bet-board-btn.active-side-bet { border-color: #ffaa00 !important; background: linear-gradient(180deg, #261f12 0%, #141009 100%) !important; box-shadow: 0 0 12px rgba(255,170,0,0.4) !important; }
        .bet-board-btn.active-side-bet .board-label { color: #ffaa00 !important; }

        /* 📢 লাইভ মেসেজ প্যানেল বার */
        .win-status-container { position: relative; z-index: 5; text-align: center; padding: 10px; margin: 5px 12px; background: rgba(9, 13, 23, 0.6); border-radius: 10px; border: 1px solid rgba(255,255,255,0.02); }
        #win-text-msg { font-size: 11px; font-weight: 700; color: #38bdf8; letter-spacing: 0.3px; }

        /* 🎛️ কন্ট্রোল ফুটার প্যানেল বার */
        .footer-controls { position: relative; z-index: 10; background: #07090f; border-top: 1px solid #161b29; padding: 10px 15px 25px 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); }
        .play-section { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 450px; margin: 0 auto; }
        .bet-btn-nav { background: #111524; border: 1px solid #202b44; color: #ffaa00; font-size: 18px; font-weight: 800; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .play-btn { flex: 1; background: linear-gradient(180deg, #ffbb00 0%, #d48800 100%); color: #000; font-size: 15px; font-weight: 900; border: none; padding: 11px 0; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(212,136,0,0.3); }
        .play-btn:disabled { background: #141721 !important; color: #4b5563 !important; box-shadow: none !important; cursor: not-allowed; }
        .icon-btn { background: #111524; border: 1px solid #202b44; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #ffaa00; font-weight: bold; }
        .icon-btn.active { background: #ffaa00; color: #000; box-shadow: 0 0 10px rgba(255,170,0,0.4); }

        .win-glow-bar { border-color: rgba(0, 255, 136, 0.4) !important; background: rgba(0, 255, 136, 0.05) !important; }
        .win-glow-bar #win-text-msg { color: #00ff88 !important; }
        .lose-glow-bar { border-color: rgba(255, 51, 102, 0.4) !important; background: rgba(255, 51, 102, 0.05) !important; }
        .lose-glow-bar #win-text-msg { color: #ff3366 !important; }
    </style>
</head>
<body>

    <div class="header" style="display:none !important;">
        <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
    </div>

    <!-- 🏟️ ঘোড়দৌড় রেসিং মেইন ট্র্যাক ক্যানভাস এরিয়া (ঘোড়া ইমোজি সহ ১০০% ফিক্সড লক বর্ম) -->
    <div class="game-board-container">
        <div class="finish-line-marker"></div>
        
        <!-- 🎯 বৃত্তের ভেতরে সংখ্যা ও দৌড়ানো ঘোড়ার ওরিজিনাল ৩D ক্যাসিনো ইমোজি এক ফ্রেমে টাইট লক ভাই ভাই -->
        <div class="race-lane-track"><div class="derby-horse-node horse-1" id="horse-node-1">🏇১</div></div>
        <div class="race-lane-track"><div class="derby-horse-node horse-2" id="horse-node-2">🏇২</div></div>
        <div class="race-lane-track"><div class="derby-horse-node horse-3" id="horse-node-3">🏇৩</div></div>
        <div class="race-lane-track"><div class="derby-horse-node horse-4" id="horse-node-4">🏇৪</div></div>
    </div>

    <!-- 💸 বাজি ধরার প্রধান ৪টি নিয়ন মডিউল (১, ২, ৩, ৪ নম্বর ঘোড়া ওডস লক ভাই ভাই) -->
    <div class="betting-board">
        <button class="bet-board-btn btn-h1" id="board-1" onclick="selectBetSide('1')">
            <span class="board-label">১ নম্বর 🔴</span>
            <span class="board-odds">x3.50</span>
        </button>

        <button class="bet-board-btn btn-h2" id="board-2" onclick="selectBetSide('2')">
            <span class="board-label">২ নম্বর 🔵</span>
            <span class="board-odds">x3.50</span>
        </button>

        <button class="bet-board-btn btn-h3" id="board-3" onclick="selectBetSide('3')">
            <span class="board-label">৩ নম্বর 🟢</span>
            <span class="board-odds">x3.50</span>
        </button>

        <button class="bet-board-btn btn-h4" id="board-4" onclick="selectBetSide('4')">
            <span class="board-label">৪ নম্বর 🟡</span>
            <span class="board-odds">x3.50</span>
        </button>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">লাকি ঘোড়া চুজ করে START বোতাম চাপুন ভাই ভাই!</span>
    </div>

    <!-- 🎛️ অ্যাকশন কন্ট্রোল ফুটার প্যানেল বার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleDerbyRaceStart()">START</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🤖</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let selectedSide = null;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedSide = side; 
            document.getElementById("board-1").classList.remove("active-side-bet");
            document.getElementById("board-2").classList.remove("active-side-bet");
            document.getElementById("board-3").classList.remove("active-side-bet");
            document.getElementById("board-4").classList.remove("active-side-bet");
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            playAudio('click');
        }

        // 🎰 [🎰 মেগা ৪-ঘোড়া ডাইনামিক লাইভ হর্স রেসিং স্প্রিন্ট এনিমেশন ইঞ্জিন ভাই ভাই]
        function animateDerbyHorseRacing(serverGameData) {
            const h1 = document.getElementById("horse-node-1");
            const h2 = document.getElementById("horse-node-2");
            const h3 = document.getElementById("horse-node-3");
            const h4 = document.getElementById("horse-node-4");

            let winningHorseId = parseInt(serverGameData.winningHorse) || 1;
            
            let pos1 = 15, pos2 = 15, pos3 = 15, pos4 = 15;
            let maxTrackWidthLimit = 320; 

            playAudio('spin');

            const raceIntervalDriver = setInterval(() => {
                pos1 += Math.floor(Math.random() * 14) + 5;
                pos2 += Math.floor(Math.random() * 14) + 5;
                pos3 += Math.floor(Math.random() * 14) + 5;
                pos4 += Math.floor(Math.random() * 14) + 5;

                if (pos1 >= maxTrackWidthLimit || pos2 >= maxTrackWidthLimit || pos3 >= maxTrackWidthLimit || pos4 >= maxTrackWidthLimit) {
                    clearInterval(raceIntervalDriver);

                    if (winningHorseId === 1) pos1 = maxTrackWidthLimit + 15;
                    if (winningHorseId === 2) pos2 = maxTrackWidthLimit + 15;
                    if (winningHorseId === 3) pos3 = maxTrackWidthLimit + 15;
                    if (winningHorseId === 4) pos4 = maxTrackWidthLimit + 15;

                    if (h1) h1.style.left = pos1 + "px"; 
                    if (h2) h2.style.left = pos2 + "px";
                    if (h3) h3.style.left = pos3 + "px"; 
                    if (h4) h4.style.left = pos4 + "px";

                    setTimeout(() => {
                        if (serverGameData.balance !== undefined) {
                            balance = parseFloat(serverGameData.balance);
                        }
                        showFinalDerbyReward(serverGameData.status, serverGameData.winAmount, winningHorseId);
                    }, 350);
                    return;
                }

                if (h1) h1.style.left = pos1 + "px";
                if (h2) h2.style.left = pos2 + "px";
                if (h3) h3.style.left = pos3 + "px";
                if (h4) h4.style.left = pos4 + "px";

            }, 80);
        }

        async function handleDerbyRaceStart() {
            if (isSpinning || isSpinning === true) return; 
            if (!selectedSide) {
                alert("🔒 বাজি প্লে করার আগে যেকোনো একটি লাকি ঘোড়া সিলেক্ট করুন ওস্তাদ!");
                return;
            }

            isSpinning = true;
            if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = true;
            if (document.getElementById("win-status-box")) document.getElementById("win-status-box").className = "win-status-container";
            if (document.getElementById("win-text-msg")) document.getElementById("win-text-msg").innerText = "🎰 রেস শুরু হয়েছে! ঘোড়া ট্র্যাকে দৌড়াচ্ছে ওস্তাদ...";
            playAudio('click');

            if (document.getElementById("horse-node-1")) document.getElementById("horse-node-1").style.left = "15px";
            if (document.getElementById("horse-node-2")) document.getElementById("horse-node-2").style.left = "15px";
            if (document.getElementById("horse-node-3")) document.getElementById("horse-node-3").style.left = "15px";
            if (document.getElementById("horse-node-4")) document.getElementById("horse-node-4").style.left = "15px";

            try {
                const response = await fetch(`${SERVER_URL}/api/derby-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId, amount: parseFloat(currentBet), wallet: urlWallet, prediction: selectedSide
                    })
                });

                const serverRes = await response.json();
                
                if (serverRes.success || serverRes.success === true) {
                    let parsedLiveBalance = serverRes.balance || serverRes.data?.balance || balance;
                    balance = parseFloat(parsedLiveBalance);
                    
                    let targetGamePayload = serverRes.gameData || serverRes;
                    animateDerbyHorseRacing(targetGamePayload);
                } else {
                    alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    stopDerbyState();
                }
            } catch (err) {
                stopDerbyState();
            }
        }

        function showFinalDerbyReward(status, winAmount, winnerHorseNum) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");
            
            let displayHorseBengali = winnerHorseNum === 1 ? "১ নম্বর লাল 🔴" : (winnerHorseNum === 2 ? "২ নম্বর নীল 🔵" : (winnerHorseNum === 3 ? "৩ নম্বর সবুজ 🟢" : "৪ নম্বর হলুদ 🟡"));

            if (status === "win") {
                playAudio('win');
                if (msgBox) msgBox.className = "win-status-container win-glow-bar";
                if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! <b>${displayHorseBengali}</b> ঘোড়া চ্যাম্পিয়ন হয়েছে। ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
            } else {
                playAudio('wheel');
                if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
                if (textMsg) textMsg.innerHTML = `💥 ওহ হো লস! <b>${displayHorseBengali}</b> ঘোড়া চ্যাম্পিয়ন হয়েছে। আবার অন ফায়ার ট্রাই করুন ওস্তাদ!`;
            }

            if (typeof balance !== 'undefined' && !isNaN(balance)) {
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }

            setTimeout(() => { fetchLiveBalance(); }, 1500);
            stopDerbyState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleDerbyRaceStart();
                }, 3500);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (data.balance !== undefined) {
                        balance = parseFloat(data.balance);
                        if (document.getElementById("user-balance")) {
                            document.getElementById("user-balance").innerText = balance.toFixed(2);
                        }
                    }
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                }
            });
        }

                async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/derby-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const serverData = await response.json();
                if (serverData.success || serverData.balance !== undefined) {
                    balance = parseFloat(serverData.balance);
                    if (document.getElementById("user-balance")) {
                        document.getElementById("user-balance").innerText = balance.toFixed(2);
                    }
                }
            } catch (e) { console.error("Balance synchronization check"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
        };

        function toggleAuto() {
            isAuto = !isAuto;
            const autoEl = document.getElementById("auto-btn");
            if (autoEl) autoEl.classList.toggle('active', isAuto);
            if (isAuto && !isSpinning) handleDerbyRaceStart();
            playAudio('click');
        }

        function stopDerbyState() {
            isSpinning = false;
            if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        const slotSounds = {
            click: new Audio('spin2.mp3'), spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'), wheel: new Audio('spin2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) {
            try { slotSounds[type].currentTime = 0; slotSounds[type].play(); } catch(e) {}
        }
    </script>
</body>
</html>
