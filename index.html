<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL DERBY HORSE RACING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">ROYAL DERBY</div>
            <div class="game">DERBY HORSE RACING</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🐎 [৪-ঘোড়ার রেসিং ট্র্যাক ক্যানভাস জোন] (টানটান ও বড় লুক ভাই ভাই) -->
    <div class="race-canvas-zone">
        <canvas id="race-canvas" width="350" height="230"></canvas>
    </div>

    <!-- 🎰 বাজি ধরার প্রধান ৪টি কালার হর্স বোতাম প্যানেল ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn horse1-btn" id="board-HORSE1" onclick="selectHorseSide('HORSE1')">
            <span class="board-label">🔴 ১ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        
        <button class="bet-board-btn horse2-btn" id="board-HORSE2" onclick="selectHorseSide('HORSE2')">
            <span class="board-label">🔵 ২ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
        
        <button class="bet-board-btn horse3-btn" id="board-HORSE3" onclick="selectHorseSide('HORSE3')">
            <span class="board-label">🟢 ৩ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>

        <button class="bet-board-btn horse4-btn" id="board-HORSE4" onclick="selectHorseSide('HORSE4')">
            <span class="board-label">🟡 ৪ নম্বর</span>
            <span class="board-odds">x3.50</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">আপনার লাকি ঘোড়া চুজ করে START বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও START বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleHorseRaceLaunch()">START</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("race-canvas");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let selectedHorse = null; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // ৪টি প্রিমিয়াম রেসিং ঘোড়ার ফিজিক্স অবজেক্ট মেমোরি ম্যাপ ভাই ভাই
        let horses = [
            { id: "HORSE1", name: "১ নম্বর", label: "১", x: 20, y: 35, color: "#ef4444" },
            { id: "HORSE2", name: "২ নম্বর", label: "২", x: 20, y: 90, color: "#3b82f6" },
            { id: "HORSE3", name: "৩ নম্বর", label: "৩", x: 20, y: 145, color: "#10b981" },
            { id: "HORSE4", name: "৪ নম্বর", label: "৪", x: 20, y: 200, color: "#f1c40f" }
        ];

        let animationFrameId = null;
        let serverWinningHorse = null;
        let raceFinishedCallback = null;

        function drawRaceTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ৪টি লেনের চমৎকার ডার্ক ব্যাকগ্রাউন্ড এবং সেপারেটর গ্রিড ভাই ভাই
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = (i % 2 === 0) ? "#0d1326" : "#0a0e1c";
                ctx.fillRect(0, i * 55 + 10, canvas.width, 55);
                
                ctx.strokeStyle = "rgba(255,255,255,0.03)";
                ctx.lineWidth = 1;
                ctx.strokeRect(0, i * 55 + 10, canvas.width, 55);
            }

            // ফিনিশ লাইন বা লাল সুতো বর্ম ১০০% নিখুঁত ড্রয়িং ভাই ভাই
            const finishLineX = canvas.width - 45;
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(finishLineX, 10);
            ctx.lineTo(finishLineX, canvas.height - 10);
            ctx.stroke();
            ctx.setLineDash([]);

            // ৪টি ঘোড়ার ওরিজিনাল নিয়ন মোশন ড্রয়িং ভাই ভাই
            horses.forEach(h => {
                ctx.font = "24px Arial";
                ctx.fillText("🐎", h.x - 14, h.y + 4);

                ctx.fillStyle = h.color;
                ctx.font = "bold 11px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.beginPath();
                ctx.arc(h.x + 16, h.y + 2, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#000";
                ctx.fillText(h.label, h.x + 16, h.y + 2.5);
            });
        }

        // 🧠 [৪-ঘোড়ার ওয়ান-ক্লিক লাইভ ক্যানভাস মোশন লুপ ইঞ্জিন ভাই ভাই]
        function raceAnimationLoop() {
            let raceEnded = false;
            const finishLineBound = canvas.width - 45;

            horses.forEach(h => {
                if (!raceEnded) {
                    if (serverWinningHorse) {
                        if (h.id === serverWinningHorse) {
                            h.x += 1.6 + Math.random() * 2.2; // উইনার স্পিড বুস্টার লক ভাই
                        } else {
                            h.x += 1.2 + Math.random() * 2.0; 
                        }
                    } else {
                        h.x += 1.0 + Math.random() * 2.0;
                    }

                    if (h.x >= finishLineBound) {
                        h.x = finishLineBound;
                        raceEnded = true;
                    }
                }
            });

            drawRaceTrack();

            if (!raceEnded) {
                animationFrameId = requestAnimationFrame(raceAnimationLoop);
            } else {
                cancelAnimationFrame(animationFrameId);
                isSpinning = false;
                if (raceFinishedCallback) raceFinishedCallback();
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/derby-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            drawRaceTrack();
        };

        function selectHorseSide(side) {
            if (isSpinning) return;
            selectedHorse = side;
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }
        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleRoyalDerbyRace();
            playAudio('click');
        }

        async function handleRoyalDerbyRace() {
            if (isSpinning) return;
            if (!selectedHorse) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি লাকি ঘোড়া (১, ২, ৩ বা ৪ নম্বর) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🏇 ঘোড়াগুলো হাই-স্পিডে দৌড়াচ্ছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            
            playAudio('click');
            playAudio('spin'); // 🚀 ঘোড়দৌড় শুরু হওয়ার কড়া ক্যাসিনো spin2.mp3 সাউন্ড ফায়ার লক ভাই!

            // ফ্রন্টএন্ডে ৪টি ঘোড়াকে এক টানা রানিং এনিমেশন মোডে অন ফায়ার করা হলো ভাই ভাই
            horses.forEach(h => {
                h.vx = 2 + Math.random() * 3; // লাইভ ডাইনামিক বাউন্সিং স্পিড রান ভাই ভাই
            });
            requestAnimationFrame(updateRaceAnimation);

            try {
                const response = await fetch(`${SERVER_URL}/api/derby-race`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedHorse
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // 🎯 [রেসিং ফিজিক্স গাইড চাবি]: সার্ভার থেকে আসা উইনার ঘোড়াকে ৩ সেকেন্ডের মাথায় সবার আগে ফিনিশিং লাইনে লক!
                    setTimeout(() => {
                        const winTarget = horses.find(h => h.id === data.winningHorse);
                        
                        const physicsInterval = setInterval(() => {
                            horses.forEach(h => {
                                if (h.id === data.winningHorse) {
                                    h.x += 4.5; // উইনার ঘোড়ার জন্য মেগা বুস্টার পুশ ভাই ভাই
                                } else {
                                    h.x += 1.5 + Math.random() * 2; // বাকি ঘোড়াদের নরমাল পুশ
                                }
                                
                                // যেকোনো ১টি ঘোড়া যখনই ৩০০ পিক্সেলের রেড লাইন ক্রস করবে তখনই রেস স্টপ লকিং ভাই ভাই
                                if (h.x >= 300) {
                                    clearInterval(physicsInterval);
                                    horses.forEach(hSub => hSub.vx = 0);
                                    
                                    // ২ সেকেন্ড পর ফাইনাল রিওয়ার্ড পপআপ ফাস্ট ডিসপ্লে হবে ভাই ভাই
                                    setTimeout(() => {
                                        showFinalReward(data.status, data.winAmount, data.winningHorse);
                                    }, 200);
                                }
                            });
                        }, 30);
                    }, 1200);

                } else {
                    horses.forEach(h => h.vx = 0);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopRaceState();
                }
            } catch (err) {
                horses.forEach(h => h.vx = 0);
                alert("⚠️ সেশনアウト! আবার START বোতাম চাপুন ভাই ভাই।");
                stopRaceState();
            }
        }

        function showFinalReward(status, winAmount, winHorse) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                playAudio('win'); // 🚀 বাজি জিতে টাকা ৩.৫ গুণ হওয়ামাত্রই রাজকীয় win2.mp3 ফায়ার লক ভাই!
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! সবার আগে লাইনে পৌঁছেছে: ${winHorse} নম্বর ঘোড়া (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ সবার আগে পৌঁছেছে: ${winHorse} নম্বর ঘোড়া। এই রাউন্ডে ভাগ্য সহায় হয়নি ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopRaceState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleRoyalDerbyRace();
                }, 2000);
            }
        }

        function stopRaceState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [৩টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; // 🔇 সাউন্ড অফ থাকলে কোনো অডিও প্লে হবে না ভাই ভাই!
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
